<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>博理数学｜凑十 · 圆点卡／海洋卡12关测试</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#203447;background:#f4f7f8;color-scheme:light}
*{box-sizing:border-box}body{margin:0}button{font:inherit;touch-action:manipulation}
main{width:min(760px,calc(100% - 24px));margin:0 auto;padding:18px 0 35px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:9px}.brand{font-size:13px;color:#416379;font-weight:700}.phase{color:#7a828b;font-size:12px}
h1{margin:3px 0 8px;font-size:clamp(28px,5vw,37px);letter-spacing:.02em}.subtitle{font-size:15px;color:#516778;line-height:1.6;margin:0 0 13px}
.track{background:#dce9ed;border-radius:999px;height:8px;overflow:hidden;margin-bottom:17px}.track>div{height:100%;width:8.3333%;background:#347a91;transition:width .22s}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.board[data-count="8"],.board[data-count="12"],.board[data-count="18"],.board[data-count="24"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{position:relative;display:block;min-width:0;min-height:0;aspect-ratio:2/3;padding:0;border:2px solid transparent;border-radius:9px;background:#fff;box-shadow:0 3px 0 #e0e8ec;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
.card-art{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
.card::before{position:absolute;inset:0;border:0 solid transparent;content:"";pointer-events:none;z-index:1}
.card[aria-pressed="true"]::before{border:4px solid #1681a5;border-radius:8px}
.card[data-group]::before{border:4px solid #54a980;border-radius:8px}
.card[data-group="2"]::before,.card[data-group="5"]::before,.card[data-group="8"]::before,.card[data-group="11"]::before{border-color:#957dc6}
.card[data-group="3"]::before,.card[data-group="6"]::before,.card[data-group="9"]::before,.card[data-group="12"]::before{border-color:#d4a45a}
.card:focus-visible{outline:3px solid #12768e;outline-offset:2px}.card[aria-pressed="true"]{border-color:#147995}.check,.group-label{position:absolute;top:5px;right:6px;line-height:1;font-size:18px;font-weight:700}.check{color:#087c9d}.group-label{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;color:#224a3b;background:#d0e9d8}
.card[data-group]{border-color:#7fb49b}
.board[data-count="18"] .card,.board[data-count="24"] .card{min-height:0}
.panel{margin-top:17px;border:1px solid #cadce2;border-radius:13px;padding:14px 15px;background:#fff}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#526779;font-size:14px}.stats strong{color:#263f50}.feedback{margin:10px 0 0;font-weight:650;line-height:1.6;min-height:24px}.panel[data-status="passed"]{border-color:#84b99a;background:#e8f6ee}.panel[data-status="passed"] .feedback{color:#21633a}.panel[data-status="warn"] .feedback{color:#9a5a29}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.actions button{border:1px solid #c0d1d9;background:#fff;color:#265066;border-radius:10px;padding:11px 14px;cursor:pointer;font-size:14px;font-weight:650;min-height:44px}.actions .primary{background:#126980;color:#fff;border-color:#126980}.actions button:disabled{opacity:.48;cursor:default}.help{font-size:13px;line-height:1.7;color:#647987;margin:15px 0 0}.foot{margin-top:22px;color:#87949d;font-size:12px}
@media(min-width:610px){main{padding-top:30px}.board[data-count="18"],.board[data-count="24"]{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:450px){main{width:calc(100% - 18px);padding-top:15px}.board{gap:7px}.card{min-height:0;border-radius:8px}.board[data-count="8"] .card,.board[data-count="12"] .card{min-height:0}.board[data-count="18"] .card,.board[data-count="24"] .card{min-height:0}.check,.group-label{font-size:16px;top:4px;right:4px}.group-label{width:19px;height:19px}.panel{padding:12px}}

.board[data-count="6"]{max-width:570px;margin-inline:auto}
.board[data-count="8"]{max-width:640px;margin-inline:auto}
.group-label,.check{z-index:2;background:#fff;box-shadow:0 1px 5px #0002;border-radius:100%;width:26px;height:26px;display:grid;place-items:center}
.check{color:#096d86}
@media(max-width:450px){.group-label,.check{width:23px;height:23px;font-size:16px}}
.theme-picker{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px;padding:12px;border:1px solid #cddce2;background:#fff;border-radius:13px}
.theme-title{font-size:14px;font-weight:700;color:#365366}
.theme-buttons{display:flex;gap:8px;flex-wrap:wrap}
.theme-option{min-height:44px;padding:9px 15px;border:2px solid #ccd9df;border-radius:11px;background:#f9fbfc;color:#34586a;font-weight:700;cursor:pointer}
.theme-option[aria-pressed="true"]{background:#e3f3ee;border-color:#34836a;color:#1d5b46;box-shadow:0 0 0 2px #34836a13}
.theme-option:focus-visible{outline:3px solid #126980;outline-offset:2px}
@media(max-width:450px){.theme-picker{padding:10px}.theme-buttons{width:100%}.theme-option{flex:1}}
.art-note{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;border:1px solid #d3dde1;border-radius:999px;background:#fff;padding:5px 11px;color:#506876;font-size:12px}
.panel[data-status="passed"]{border:2px solid #57a57e;background:#f0f9f3;box-shadow:0 7px 22px #3c91631b}
.panel[data-status="passed"] .feedback{font-size:22px;color:#205e40;text-align:center}
.actions .primary:not([hidden]){box-shadow:0 4px 12px #12698038;font-size:16px;padding:13px 22px}
.finish-overlay[hidden]{display:none!important}
.finish-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(17,39,48,.68);backdrop-filter:blur(3px)}
.finish-sheet{width:min(430px,100%);background:#fffcf4;border:1px solid #efddb7;border-radius:22px;padding:38px 27px 28px;text-align:center;box-shadow:0 20px 65px #0004}
.finish-symbol{width:74px;height:74px;margin:0 auto 17px;border-radius:50%;display:grid;place-items:center;background:#e9f1de;color:#3d7555;font-size:43px;font-weight:700}
.finish-kicker{font-size:14px;letter-spacing:.14em;color:#7b765e;font-weight:650}
.finish-sheet h2{font-size:clamp(30px,8vw,39px);line-height:1.25;color:#264938;margin:9px 0 15px}
.finish-sheet p{font-size:17px;line-height:1.8;color:#4e6658;margin:0 0 25px}
.finish-cta{display:flex;flex-direction:column;gap:10px}
.finish-cta button{min-height:48px;border-radius:11px;border:1px solid #bad0c1;background:white;color:#2a5944;font-size:15px;font-weight:700;cursor:pointer}
.finish-cta button.primary{background:#327451;color:#fff;border-color:#327451;font-size:17px}



@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<main>
  <header><div class="top"><span class="brand">予山海 · 博理数学</span><span class="phase">独立测试版 · C04</span></div>
    <h1>凑十 <span id="headingLevel">第 1 / 12 关</span></h1>
    <p class="subtitle" id="instructions">把 6 张牌分成 3 组，每组正好 10。全部分完就能过关。</p><div class="track" aria-hidden="true"><div id="trackFill"></div></div>
  </header>
  <div class="theme-picker" role="group" aria-label="选择卡片类型">
    <span class="theme-title">想玩哪一种卡？</span>
    <div class="theme-buttons">
      <button type="button" class="theme-option" id="dotTheme" aria-pressed="true">● 圆点卡</button>
      <button type="button" class="theme-option" id="oceanTheme" aria-pressed="false">🐬 海洋卡</button>
    </div>
  </div>
  <p class="art-note" id="artNote">圆点卡 · 三种数量排列混合</p>
  <div class="board" id="board" role="group" aria-label="凑十数量卡"></div>
  <div class="panel" id="panel" role="status" aria-live="polite" aria-atomic="true">
    <div class="stats"><span>本次选择：<strong id="selectedSum">0</strong></span><span>已完成：<strong id="groupCount">0 / 3</strong> 组</span><span>剩余：<strong id="remainingCount">6</strong> 张</span></div>
    <p class="feedback" id="feedback">点一张卡片开始。</p>
  </div>
  <div class="actions"><button id="clearSelection">清空当前选择</button><button id="restartLevel">重新尝试本关</button><button class="primary" id="nextLevel" hidden>进入下一关</button></div>
  <p class="help">点击卡片选择；凑成 10 时自动标记一组。点击已标记组的任意一张，可以取消整组。不同的正确分法都有效。</p>
  <p class="foot">测试版：先选圆点卡或海洋卡，同一关不混用两种主题；切换只改变卡面，不清除进度。暂不限制每日时间。</p>
</main>
<div class="finish-overlay" id="finishOverlay" role="dialog" aria-modal="true" aria-labelledby="finishTitle" hidden>
 <div class="finish-sheet">
  <div class="finish-symbol" aria-hidden="true">✓</div>
  <div class="finish-kicker">博理数学 · 凑十</div>
  <h2 id="finishTitle">12 关全部完成！</h2>
  <p>你把所有卡片都分成了 10。<br>今天的数学探索完成啦！</p>
  <div class="finish-cta">
    <button class="primary" id="viewFinished">查看我的完成牌局</button>
    <button id="restartAll">从第 1 关重新测试</button>
  </div>
 </div>
</div>

const LAYOUT_KEYS = ['five','mahjong','factor'];
const LEVELS = [{"number":1,"cards":[1,9,2,8,3,7],"groupTarget":3,"focus":"两张凑10入门"},{"number":2,"cards":[7,1,3,4,2,3],"groupTarget":2,"focus":"较长组合初体验"},{"number":3,"cards":[5,2,3,5,1,8,9,7],"groupTarget":4,"focus":"增加干扰牌、观察配对"},{"number":4,"cards":[3,5,2,6,5,4,4,1],"groupTarget":3,"focus":"二张与三张组合"},{"number":5,"cards":[8,5,1,4,9,9,5,7,6,2,1,3],"groupTarget":6,"focus":"多组两张配对"},{"number":6,"cards":[9,7,7,1,4,5,3,6,3,2,1,2],"groupTarget":5,"focus":"二张、三张混合"},{"number":7,"cards":[4,3,2,1,9,1,3,2,4,4,1,6],"groupTarget":4,"focus":"引入五张组合"},{"number":8,"cards":[4,9,8,6,5,7,2,8,3,2,9,5,3,1,7,4,1,6],"groupTarget":9,"focus":"大量两张配对"},{"number":9,"cards":[5,1,1,1,2,9,5,3,8,3,1,3,3,4,4,2,3,2],"groupTarget":6,"focus":"二至五张混合"},{"number":10,"cards":[9,6,6,2,1,3,8,8,2,5,8,2,9,5,4,4,3,1,9,7,5,7,1,5],"groupTarget":12,"focus":"24张大牌面配对"},{"number":11,"cards":[8,9,4,2,6,7,3,8,7,5,3,5,2,5,9,2,1,1,1,1,2,1,4,4],"groupTarget":10,"focus":"大牌面中的长短组合"},{"number":12,"cards":[2,1,9,8,1,2,5,4,3,3,7,1,3,3,2,1,1,4,5,1,4,6,1,3],"groupTarget":8,"focus":"综合挑战：二、三、四、五张"}];
const LABELS=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];
const $=id=>document.getElementById(id);
const board=$('board'),panel=$('panel'),feedback=$('feedback');
const nextButton=$('nextLevel');
const params=new URLSearchParams(location.search);
const devLevel=Number(params.get('level'));
let levelIndex=Number.isInteger(devLevel)&&devLevel>=1&&devLevel<=12?devLevel-1:0;
let cards=[], selected=new Set(), groups=[], passed=false;
// One theme per board. Each theme retains all three teacher-provided quantity layouts.
let theme='dot';
function artFor(card){return (theme==='ocean'?OCEAN_ART:DOT_ART)[card.layout][card.value-1];}
function describeTheme(){return theme==='ocean'?'海洋动物卡':'圆点卡';}
function updateThemeControls(){
  $('dotTheme').setAttribute('aria-pressed',String(theme==='dot'));
  $('oceanTheme').setAttribute('aria-pressed',String(theme==='ocean'));
  $('artNote').textContent=(theme==='dot'?'圆点卡':'海洋卡')+' · 五结构／麻将／圈状三种排列混合';
}
function changeTheme(next){
  if(theme===next)return;
  theme=next;
  updateThemeControls();
  for(const card of cards){
    const el=board.children[card.id];
    el.querySelector('.card-art').src=artFor(card);
  }
  render();
}
$('dotTheme').addEventListener('click',()=>changeTheme('dot'));
$('oceanTheme').addEventListener('click',()=>changeTheme('ocean'));
function loadLevel(index){
  levelIndex=index;const level=LEVELS[levelIndex];
  cards=level.cards.map((value,id)=>({id,value,layout:LAYOUT_KEYS[(id+index)%LAYOUT_KEYS.length]}));selected=new Set();groups=[];passed=false;
  $('finishOverlay').hidden=true;
  $('headingLevel').textContent=`第 ${level.number} / 12 关`;
  $('instructions').textContent=`把 ${cards.length} 张牌分成 ${level.groupTarget} 组，每组正好 10。全部分完就能过关。`;
  $('trackFill').style.width=`${100*(index+1)/LEVELS.length}%`;
  board.dataset.count=cards.length;
  board.replaceChildren();
  cards.forEach(({id,value})=>{
    const el=document.createElement('button');el.type='button';el.className='card';el.dataset.id=String(id);
    const pic=document.createElement('img');pic.className='card-art';pic.src=artFor(cards[id]);pic.alt='';pic.draggable=false;el.append(pic);
    el.setAttribute('aria-label',`数量 ${value} 的${describeTheme()}`);
    el.addEventListener('click',()=>pick(id));board.appendChild(el);
  });
  nextButton.hidden=true;
  render();
}
function total(ids){let s=0;for(const id of ids)s+=cards[id].value;return s;}
function pick(id){
  const existingIndex=groups.findIndex(g=>g.ids.includes(id));
  if(existingIndex!==-1){groups.splice(existingIndex,1);selected.clear();render('已取消这一组，可以重新选择。');return;}
  if(selected.has(id)){selected.delete(id);render();return;}
  // Preserve the original card selection behavior while supporting 2-5 cards per group.
  if(selected.size===5){render('每组最多选 5 张牌，请先取消一张。','warn');return;}
  const sumIfAdded=total(selected)+cards[id].value;
  if(sumIfAdded>10){render('加上这张就超过 10 了，换一张试试。','warn');return;}
  selected.add(id);
  if(selected.size>=2&&total(selected)===10){
    const number=Array.from({length:12},(_,n)=>n+1).find(n=>!groups.some(g=>g.number===n));
    if(number===undefined){selected.delete(id);render('已经完成所有目标组。','warn');return;}
    groups.push({number,ids:[...selected]});selected.clear();render('成功凑出一组 10！');return;
  }
  render();
}
function render(message='',status='playing'){
  const level=LEVELS[levelIndex];
  const usedIds=new Set(groups.flatMap(g=>g.ids));
  const previouslyPassed=passed;
  passed=groups.length===level.groupTarget&&usedIds.size===cards.length&&
    groups.every(g=>g.ids.length>=2&&g.ids.length<=5&&total(g.ids)===10)&&
    groups.reduce((n,g)=>n+g.ids.length,0)===cards.length;
  [...board.children].forEach((el,id)=>{
    const group=groups.find(g=>g.ids.includes(id));
    const value=cards[id].value;el.querySelectorAll('.group-label,.check').forEach(x=>x.remove());
    if(group){
      el.dataset.group=group.number;el.removeAttribute('aria-pressed');
      const label=document.createElement('span');label.className='group-label';label.textContent=LABELS[group.number-1];label.setAttribute('aria-hidden','true');el.append(label);
      el.setAttribute('aria-label',`数量 ${value} 的${describeTheme()}，第 ${group.number} 组，点击取消整组`);
    }else{
      delete el.dataset.group;el.setAttribute('aria-pressed',String(selected.has(id)));
      if(selected.has(id)){const check=document.createElement('span');check.className='check';check.textContent='✓';check.setAttribute('aria-hidden','true');el.append(check);}
      el.setAttribute('aria-label',`数量 ${value} 的${describeTheme()}`);
    }
  });
  $('selectedSum').textContent=total(selected);
  $('groupCount').textContent=`${groups.length} / ${level.groupTarget}`;
  $('remainingCount').textContent=cards.length-usedIds.size;
  panel.dataset.status=passed?'passed':status;
  if(passed){
    feedback.textContent=levelIndex===LEVELS.length-1?'全部 12 关完成！祝贺你通关。':'本关完成！可以进入下一关。';
    nextButton.hidden=levelIndex===LEVELS.length-1;
    if(levelIndex===LEVELS.length-1 && !previouslyPassed){$('finishOverlay').hidden=false;$('viewFinished').focus();}
  }else{
    $('finishOverlay').hidden=true;
    feedback.textContent=message||(selected.size?'继续选牌，凑成 10 就会自动成组。':'点牌凑出一组 10。');nextButton.hidden=true;
  }
  $('clearSelection').disabled=passed||!selected.size;
}
$('viewFinished').addEventListener('click',()=>{$('finishOverlay').hidden=true;board.scrollIntoView({behavior:'smooth',block:'start'});});
$('restartAll').addEventListener('click',()=>loadLevel(0));
$('clearSelection').addEventListener('click',()=>{selected.clear();render('已清空当前选择。');});
$('restartLevel').addEventListener('click',()=>loadLevel(levelIndex));
nextButton.addEventListener('click',()=>{if(passed&&levelIndex<LEVELS.length-1)loadLevel(levelIndex+1);});
updateThemeControls();
loadLevel(levelIndex);
</script>
