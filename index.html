<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>抢10｜动物版 v0.9</title>
  <style>
    :root { --ink:#163244; --muted:#607c8a; --blue:#1896c4; --orange:#ff9b2f; --red:#d64040; --line:#d5edf6 }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
    html,body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:linear-gradient(180deg,#f8fdff,#edf8fc) }
    button { font:inherit; touch-action:manipulation }
    [hidden] { display:none!important }
    .app { width:min(1040px,100%); margin:auto; padding:14px }
    .panel { background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:0 10px 28px #2260791c; padding:22px }
    .home,.result { max-width:720px; margin:5vh auto 0 }
    .tag { display:inline-block; background:#eaf8fd; color:#238ab3; border-radius:999px; padding:7px 11px; font-size:13px; font-weight:700 }
    h1 { font-size:46px; margin:14px 0 8px }
    .lead { color:var(--muted); line-height:1.75 }
    .rules { background:#f8fcfe; border:1px solid var(--line); border-radius:18px; padding:15px 17px; line-height:1.9; font-size:15px }
    .primary { border:0; border-radius:999px; background:var(--blue); color:#fff; font-size:20px; font-weight:800; padding:15px 28px; margin-top:20px; cursor:pointer; box-shadow:0 5px 0 #117aa1 }
    .primary:disabled { opacity:.6; cursor:wait }
    .secondary { border:1px solid #cce7f1; background:#fff; color:var(--ink); border-radius:999px; padding:13px 20px; font-weight:700; cursor:pointer; margin:16px 0 0 8px }
    .load-status { min-height:1.5em; color:var(--muted); font-size:13px; line-height:1.6 }
    .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px }
    .name { font-size:19px; font-weight:900; white-space:nowrap }
    .ver { font-size:12px; color:var(--muted); font-weight:500; margin-left:6px }
    .metrics { display:flex; gap:8px; align-items:center }
    .pill { border:1px solid #cde8f2; background:#fff; border-radius:999px; padding:8px 12px; white-space:nowrap; font-size:14px }
    .timer { font-weight:900; font-size:19px; min-width:78px; text-align:center; font-variant-numeric:tabular-nums }
    .timer.danger { color:var(--red); border-color:#f0b6b6; background:#fff7f7 }
    .board { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; width:min(100%,calc((100svh - 170px) * 1.5)); margin:auto }
    .card { position:relative; aspect-ratio:1; min-width:0; border-radius:18px; border:4px solid transparent; background:#fff; box-shadow:0 5px 16px #1e576d1a; cursor:pointer; overflow:hidden; padding:0; transition:border-color .1s,box-shadow .1s }
    .card-image { display:block; width:100%; height:100%; object-fit:contain; pointer-events:none; user-select:none; -webkit-user-drag:none }
    .card.selected { border-color:var(--orange); box-shadow:0 7px 18px #ff9b2f47 }
    .card.selected:after { content:"✓"; position:absolute; right:8px; top:8px; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--orange); color:#fff; font-weight:900; font-size:18px }
    .card:focus-visible,button:focus-visible { outline:3px solid #156c91; outline-offset:3px }
    .card.blocked { animation:shake .25s linear; border-color:var(--red) }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .toast { position:fixed; left:50%; top:72px; transform:translateX(-50%); width:max-content; max-width:90vw; background:#2d3b43; color:#fff; border-radius:999px; padding:10px 16px; font-weight:700; opacity:0; pointer-events:none; z-index:99 }
    .toast.show { opacity:.96 }
    .note { text-align:center; color:var(--muted); font-size:12px; margin:12px 0 0; line-height:1.5 }
    .debug { text-align:center; color:#a13b6d; font-size:13px; font-weight:700; margin-top:7px }
    .result { text-align:center }
    .result h2 { font-size:30px; margin:12px 0 }
    .big { font-size:78px; font-weight:900; color:var(--blue); line-height:1; margin-top:20px }
    .label { color:var(--muted) }
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:22px 0; text-align:left }
    .stat { background:#f8fcfe; border:1px solid var(--line); border-radius:16px; padding:15px }
    .stat b { display:block; font-size:24px; margin-bottom:3px }
    .stat span { font-size:13px; color:var(--muted) }
    @media(max-width:680px) {
      .app { padding:8px } .panel { padding:12px; border-radius:18px }
      .home,.result { margin-top:2vh } h1 { font-size:38px }
      .board { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; width:min(100%,calc((100svh - 160px) * .66667)) }
      .card { border-radius:13px; border-width:3px }
      .card.selected:after { width:24px; height:24px; right:6px; top:6px; font-size:16px }
      .pill { padding:6px 9px; font-size:12px } .timer { font-size:17px; min-width:64px } .name { font-size:16px }
    }
    @media(prefers-reduced-motion:reduce) { .card { transition:none } .card.blocked { animation:none } }
  </style>
  <script src="game-v09.js" defer></script>
  <script src="app-v09.js" defer></script>
</head>
<body>
  <main class="app">
    <section id="home" class="panel home">
      <span class="tag">动物版 · 60秒挑战</span><h1>抢10 <span class="ver">v0.9</span></h1>
      <p class="lead">从6张动物卡中选择若干张，让其中任意一种动物的数量总和恰好等于10。</p>
      <div class="rules">
        点击整张卡选择；再次点击已选卡，可以取消。<br>
        每张卡里的两种动物，都要一起计算。<br>
        <b>任何一种动物超过10，这张新卡不能加入。</b><br>
        两种都没超过10，且任意一种恰好等于10，就立即换题。<br>
        60秒内，看看你能完成多少组！
      </div>
      <button id="startBtn" class="primary" disabled>正在加载卡片…</button>
      <p id="loadStatus" class="load-status" role="status" aria-live="polite"></p>
      <noscript>请在浏览器中开启 JavaScript 后游玩。</noscript>
    </section>
    <section id="game" class="panel" hidden>
      <div class="top">
        <div class="name">抢10 <span class="ver">v0.9</span></div>
        <div class="metrics"><div class="pill">完成 <b id="done">0</b> 组</div><div id="timer" class="pill timer" aria-label="剩余秒数">60.0</div></div>
      </div>
      <div id="board" class="board" aria-label="六张动物卡"></div>
      <p class="note">橙框表示已选，再点可取消。凑成10立即换题。</p>
      <div id="debug" class="debug" hidden></div>
    </section>
    <section id="result" class="panel result" hidden>
      <span class="tag">本局结束</span><h2>60秒挑战成绩</h2>
      <div id="finalDone" class="big">0</div><div class="label">完成组数</div>
      <div class="stats">
        <div class="stat"><b id="fastest">—</b><span>最快完成</span></div>
        <div class="stat"><b id="average">—</b><span>平均每题</span></div>
        <div class="stat"><b id="blockedCount">0</b><span>超过10，被拒绝的点击</span></div>
        <div class="stat"><b id="cancelled">0</b><span>取消已选卡次数</span></div>
      </div>
      <button id="againBtn" class="primary">再玩60秒</button><button id="backBtn" class="secondary">返回规则</button>
    </section>
  </main>
  <div id="toast" class="toast" role="status">超过10，这张卡不能选</div>
</body>
</html>
