<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抢10｜动物版 v0.7</title>
<style>
:root{--ink:#163244;--muted:#6e8491;--cyan2:#1896c4;--orange:#ff9b2f;--red:#e45151;--line:#d5edf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f8fdff,#edf8fc);color:var(--ink)}button{font:inherit}.hidden{display:none!important}.app{width:min(1040px,100%);margin:auto;padding:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 28px rgba(34,96,121,.11);padding:22px}.home,.result{max-width:720px;margin:5vh auto 0}.tag{display:inline-block;background:#eaf8fd;color:#238ab3;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700}h1{font-size:46px;margin:14px 0 8px}.lead{color:var(--muted);line-height:1.75}.rules{background:#f8fcfe;border:1px solid var(--line);border-radius:18px;padding:15px 17px;line-height:1.8;font-size:15px}.primary{border:0;border-radius:999px;background:var(--cyan2);color:#fff;font-size:20px;font-weight:800;padding:15px 28px;margin-top:20px;cursor:pointer;box-shadow:0 7px 0 #117aa1}.secondary{border:1px solid #cce7f1;background:#fff;color:var(--ink);border-radius:999px;padding:13px 20px;font-weight:750;cursor:pointer;margin-left:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.name{font-size:19px;font-weight:900}.ver{font-size:12px;color:#7d96a3;font-weight:700;margin-left:6px}.metrics{display:flex;gap:8px;align-items:center}.pill{border:1px solid #cde8f2;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:14px}.timer{font-weight:900;font-size:19px;min-width:78px;text-align:center}.timer.danger{color:var(--red);border-color:#f0b6b6;background:#fff7f7}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{position:relative;aspect-ratio:1/1;border-radius:18px;border:4px solid transparent;background:#fff;box-shadow:0 5px 16px rgba(30,87,109,.10);cursor:pointer;transition:transform .1s,border-color .1s,box-shadow .1s;overflow:hidden;padding:0}.sheet{position:absolute;width:300%;height:200%;max-width:none;pointer-events:none;user-select:none}.card.selected{border-color:var(--orange);transform:translateY(-5px);box-shadow:0 9px 19px rgba(255,155,47,.28)}.card.selected:after{content:"✓";position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-weight:900;font-size:19px;z-index:2}.card.blocked{animation:shake .25s linear;border-color:var(--red)}.card.locked{pointer-events:none}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:#2d3b43;color:#fff;border-radius:999px;padding:10px 16px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .12s;z-index:99}.toast.show{opacity:.95}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}.debug{text-align:center;color:#a13b6d;font-size:13px;font-weight:800;margin-top:7px;display:none}.debug.on{display:block}.result{text-align:center}.result h2{font-size:32px;margin:5px 0}.big{font-size:78px;font-weight:950;color:var(--cyan2);line-height:1;margin-top:20px}.label{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0;text-align:left}.stat{background:#f8fcfe;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:24px;margin-bottom:3px}.stat span{font-size:13px;color:var(--muted)}
@media(max-width:680px){.app{padding:8px}.panel{padding:12px;border-radius:18px}.home,.result{margin-top:2vh}h1{font-size:38px}.board{grid-template-columns:repeat(2,1fr);gap:7px}.card{border-radius:13px;border-width:3px}.card.selected{transform:translateY(-3px)}.card.selected:after{width:25px;height:25px;right:6px;top:6px;font-size:16px}.pill{padding:6px 9px;font-size:12px}.timer{font-size:17px;min-width:70px}.name{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="panel home">
  <span class="tag">动物版 · 60秒挑战</span><h1>抢10</h1>
  <p class="lead">从6张动物卡中选择若干张，让其中任意一种动物的数量总和恰好等于10。</p>
  <div class="rules"><b>玩法：</b>点击整张卡选择；再次点击已选卡可以取消。<br>每点一张新卡，系统同时计算两种动物。<br><b>只要任意一种动物恰好等于10，本题立即成功。</b><br>如果没有凑成10，但某一种动物超过10，这张新卡不能加入。</div>
  <button id="startBtn" class="primary">开始60秒挑战</button>
</section>
<section id="game" class="panel hidden">
  <div class="top"><div class="name">抢10 <span class="ver">v0.7</span></div><div class="metrics"><div class="pill">完成 <b id="done">0</b> 组</div><div id="timer" class="pill timer">60.0</div></div></div>
  <div id="board" class="board"></div>
  <div class="note">点整张卡；橙框表示已选。任意一种动物恰好凑成10，就立即过题。</div>
  <div id="debug" class="debug"></div>
</section>
<section id="result" class="panel result hidden">
  <span class="tag">本局结束</span><h2>60秒挑战成绩</h2>
  <div id="finalDone" class="big">0</div><div class="label">完成组数</div>
  <div class="stats"><div class="stat"><b id="fastest">—</b><span>最快完成</span></div><div class="stat"><b id="average">—</b><span>平均每题</span></div><div class="stat"><b id="blockedCount">0</b><span>超过10，被拒绝的点击</span></div><div class="stat"><b id="cancelled">0</b><span>取消已选卡次数</span></div></div>
  <button id="againBtn" class="primary">再玩60秒</button><button id="backBtn" class="secondary">返回规则</button>
</section>
</div><div id="toast" class="toast">超过10，这张卡不能选</div>
<script>
const DECKS={
 fish:{name:'小丑鱼',img:'https://uploader.shimo.im/f/7jKatPWHsaoq4OKs.png!thumbnail',cards:[{d:3,o:2,slot:0},{d:5,o:4,slot:1},{d:2,o:5,slot:2},{d:4,o:1,slot:3},{d:1,o:4,slot:4},{d:5,o:3,slot:5}]},
 turtle:{name:'海龟',img:'https://uploader.shimo.im/f/sk1EH7C17W2s5OBT.png!thumbnail',cards:[{d:3,o:2,slot:0},{d:6,o:4,slot:1},{d:2,o:5,slot:2},{d:4,o:1,slot:3},{d:1,o:6,slot:4},{d:5,o:3,slot:5}]}
};
const $=id=>document.getElementById(id);const DEBUG=new URLSearchParams(location.search).get('debug')==='1';
let running=false,deadline=0,raf=0,done=0,blockedCount=0,cancelled=0,times=[],started=0,last=null,transitioning=false,currentFamily='fish',toastTimer=0;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cropStyle(slot){const col=slot%3,row=Math.floor(slot/3);return `left:-${col*100}%;top:-${row*100}%;`}
function selectedTotals(extra=null){let d=0,o=0;document.querySelectorAll('#board .card.selected').forEach(el=>{d+=Number(el.dataset.d);o+=Number(el.dataset.o)});if(extra&&!extra.classList.contains('selected')){d+=Number(extra.dataset.d);o+=Number(extra.dataset.o)}return{d,o}}
function showDebug(t,prefix='当前'){if(!DEBUG)return;const fam=DECKS[currentFamily];$('debug').classList.add('on');$('debug').textContent=`${prefix}：海豚 ${t.d} ｜ ${fam.name} ${t.o}`}
function toast(){const t=$('toast');t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),450)}
function newQuestion(){if(!running)return;transitioning=false;currentFamily=last===null?(Math.random()<.5?'fish':'turtle'):(last==='fish'?'turtle':'fish');last=currentFamily;const deck=DECKS[currentFamily];const cards=shuffle(deck.cards.map((c,i)=>({...c,id:`${currentFamily}-${i}`})));started=performance.now();$('board').innerHTML=cards.map((c,i)=>`<button class="card" data-d="${c.d}" data-o="${c.o}" data-slot="${c.slot}" aria-label="动物卡${i+1}"><img class="sheet" src="${deck.img}" style="${cropStyle(c.slot)}" alt=""></button>`).join('');document.querySelectorAll('#board .card').forEach(el=>el.onclick=clickCard);showDebug({d:0,o:0})}
function success(){transitioning=true;done++;times.push(performance.now()-started);$('done').textContent=done;document.querySelectorAll('#board .card').forEach(c=>c.classList.add('locked'));setTimeout(()=>{if(running)newQuestion()},90)}
function clickCard(e){if(!running||transitioning)return;const el=e.currentTarget;if(el.classList.contains('selected')){el.classList.remove('selected');cancelled++;showDebug(selectedTotals());return}
 const candidate=selectedTotals(el);showDebug(candidate,'加入后');
 if(candidate.d===10||candidate.o===10){el.classList.add('selected');success();return}
 if(candidate.d>10||candidate.o>10){blockedCount++;el.classList.remove('blocked');void el.offsetWidth;el.classList.add('blocked');setTimeout(()=>el.classList.remove('blocked'),280);toast();return}
 el.classList.add('selected');showDebug(selectedTotals());}
function tick(){if(!running)return;const left=Math.max(0,deadline-performance.now());$('timer').textContent=(left/1000).toFixed(1);$('timer').classList.toggle('danger',left<=10000);if(left<=0){finish();return}raf=requestAnimationFrame(tick)}
function start(){done=blockedCount=cancelled=0;times=[];last=null;transitioning=false;running=true;$('done').textContent='0';$('timer').textContent='60.0';$('home').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');deadline=performance.now()+60000;newQuestion();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function sec(ms){return(ms/1000).toFixed(2)+'秒'}function finish(){if(!running)return;running=false;transitioning=true;cancelAnimationFrame(raf);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('finalDone').textContent=done;$('blockedCount').textContent=blockedCount;$('cancelled').textContent=cancelled;if(times.length){$('fastest').textContent=sec(Math.min(...times));$('average').textContent=sec(times.reduce((a,b)=>a+b,0)/times.length)}else{$('fastest').textContent=$('average').textContent='—'}}
// 自检：海龟牌 6+4 与 1+6 组合时，海龟必须为10
(function selfTest(){const a=DECKS.turtle.cards[1],b=DECKS.turtle.cards[4];if(a.o+b.o!==10)console.error('数据自检失败',a,b)})();
$('startBtn').onclick=start;$('againBtn').onclick=start;$('backBtn').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')};
</script></body></html>
