<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抢10｜动物版</title>
<style>
:root{--ink:#163244;--muted:#6e8491;--cyan:#55c8ef;--cyan2:#1896c4;--orange:#ff9b2f;--red:#e45151;--bg:#f1fafe;--line:#d5edf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f8fdff,#edf8fc);color:var(--ink)}button{font:inherit}.hidden{display:none!important}.app{width:min(1040px,100%);margin:auto;padding:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 28px rgba(34,96,121,.11);padding:22px}.home,.result{max-width:720px;margin:5vh auto 0}.tag{display:inline-block;background:#eaf8fd;color:#238ab3;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700}h1{font-size:46px;margin:14px 0 8px}.lead{color:var(--muted);line-height:1.75}.rules{background:#f8fcfe;border:1px solid var(--line);border-radius:18px;padding:15px 17px;line-height:1.8;font-size:15px}.primary{border:0;border-radius:999px;background:var(--cyan2);color:#fff;font-size:20px;font-weight:800;padding:15px 28px;margin-top:20px;cursor:pointer;box-shadow:0 7px 0 #117aa1}.primary:active{transform:translateY(3px);box-shadow:0 4px 0 #117aa1}.secondary{border:1px solid #cce7f1;background:#fff;color:var(--ink);border-radius:999px;padding:13px 20px;font-weight:750;cursor:pointer;margin-left:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.name{font-size:19px;font-weight:900}.metrics{display:flex;gap:8px;align-items:center}.pill{border:1px solid #cde8f2;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:14px}.timer{font-weight:900;font-size:19px;min-width:78px;text-align:center}.timer.danger{color:var(--red);border-color:#f0b6b6;background:#fff7f7}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{position:relative;aspect-ratio:1/1;border-radius:18px;border:4px solid transparent;background-color:#fff;background-repeat:no-repeat;background-size:300% 200%;box-shadow:0 5px 16px rgba(30,87,109,.10);cursor:pointer;transition:transform .1s,border-color .1s,box-shadow .1s}.card.selected{border-color:var(--orange);transform:translateY(-5px);box-shadow:0 9px 19px rgba(255,155,47,.28)}.card.selected:after{content:"✓";position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-weight:900;font-size:19px}.card.locked{pointer-events:none}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}.result{text-align:center}.result h2{font-size:32px;margin:5px 0}.big{font-size:78px;font-weight:950;color:var(--cyan2);line-height:1;margin-top:20px}.label{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0;text-align:left}.stat{background:#f8fcfe;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:24px;margin-bottom:3px}.stat span{font-size:13px;color:var(--muted)}.version{font-size:11px;color:#9aadb7;margin-top:10px}
@media(max-width:680px){.app{padding:8px}.panel{padding:12px;border-radius:18px}.home,.result{margin-top:2vh}h1{font-size:38px}.board{grid-template-columns:repeat(2,1fr);gap:7px}.card{border-radius:13px;border-width:3px}.card.selected{transform:translateY(-3px)}.card.selected:after{width:25px;height:25px;right:6px;top:6px;font-size:16px}.pill{padding:6px 9px;font-size:12px}.timer{font-size:17px;min-width:70px}.name{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="panel home">
  <span class="tag">动物版 · 60秒挑战</span><h1>抢10</h1>
  <p class="lead">从6张动物卡中选择若干张，让其中任意一种动物的数量总和恰好等于10。</p>
  <div class="rules"><b>玩法：</b>点击整张卡选择；再次点击已选卡可以取消。<br>系统会分别累计每一种动物的数量。<br><b>只要其中任意一种动物恰好等于10，本题就成功；其他动物即使超过10，也不影响。</b><br>成功后系统立即进入下一题。60秒内，看看你能完成多少组。</div>
  <button id="startBtn" class="primary">开始60秒挑战</button>
  <div class="version">版本 v0.3 · 规则B</div>
</section>
<section id="game" class="panel hidden">
  <div class="top"><div class="name">抢10</div><div class="metrics"><div class="pill">完成 <b id="done">0</b> 组</div><div id="timer" class="pill timer">60.0</div></div></div>
  <div id="board" class="board"></div>
  <div class="note">点整张卡；橙框表示已选。只要任意一种动物恰好凑成10，就成功。</div>
</section>
<section id="result" class="panel result hidden">
  <span class="tag">本局结束</span><h2>60秒挑战成绩</h2>
  <div id="finalDone" class="big">0</div><div class="label">完成组数</div>
  <div class="stats">
    <div class="stat"><b id="fastest">—</b><span>最快完成</span></div>
    <div class="stat"><b id="average">—</b><span>平均每题</span></div>
    <div class="stat"><b id="selectCount">0</b><span>选择卡片次数</span></div>
    <div class="stat"><b id="cancelled">0</b><span>取消已选卡次数</span></div>
  </div>
  <button id="againBtn" class="primary">再玩60秒</button><button id="backBtn" class="secondary">返回规则</button>
</section>
</div>
<script>
const DECKS={fish:[{d:3,o:2},{d:5,o:4},{d:2,o:5},{d:4,o:1},{d:1,o:4},{d:5,o:3}],turtle:[{d:3,o:2},{d:6,o:4},{d:2,o:5},{d:4,o:1},{d:1,o:6},{d:5,o:3}]};
const IMG={fish:'https://uploader.shimo.im/f/7jKatPWHsaoq4OKs.png!thumbnail',turtle:'https://uploader.shimo.im/f/sk1EH7C17W2s5OBT.png!thumbnail'};
const pos=i=>`${(i%3)*50}% ${Math.floor(i/3)*100}%`;
const $=id=>document.getElementById(id);
let running=false,deadline=0,raf=0,done=0,selectCount=0,cancelled=0,times=[],started=0,last=null,questionId=0,transitioning=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selectedTotals(){let d=0,o=0;document.querySelectorAll('#board .card.selected').forEach(el=>{d+=Number(el.dataset.d);o+=Number(el.dataset.o)});return{d,o}}
function newQuestion(){if(!running)return;transitioning=false;questionId++;const family=last===null?(Math.random()<.5?'fish':'turtle'):(last==='fish'?'turtle':'fish');last=family;const cards=shuffle(DECKS[family].map((x,i)=>({...x,slot:i,family})));started=performance.now();$('board').innerHTML=cards.map((c,i)=>`<button class="card" data-q="${questionId}" data-d="${c.d}" data-o="${c.o}" style="background-image:url('${IMG[c.family]}');background-position:${pos(c.slot)}" aria-label="动物卡${i+1}"></button>`).join('');document.querySelectorAll('#board .card').forEach(el=>el.onclick=clickCard)}
function clickCard(e){if(!running||transitioning)return;const el=e.currentTarget;if(Number(el.dataset.q)!==questionId)return;if(el.classList.contains('selected')){el.classList.remove('selected');cancelled++;return}el.classList.add('selected');selectCount++;const t=selectedTotals();if(t.d===10||t.o===10){transitioning=true;done++;times.push(performance.now()-started);$('done').textContent=done;document.querySelectorAll('#board .card').forEach(c=>c.classList.add('locked'));setTimeout(()=>{if(running)newQuestion()},120)}}
function tick(){if(!running)return;const left=Math.max(0,deadline-performance.now());$('timer').textContent=(left/1000).toFixed(1);$('timer').classList.toggle('danger',left<=10000);if(left<=0){finish();return}raf=requestAnimationFrame(tick)}
function start(){done=selectCount=cancelled=0;times=[];last=null;questionId=0;transitioning=false;running=true;$('done').textContent='0';$('timer').textContent='60.0';$('home').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');deadline=performance.now()+60000;newQuestion();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function sec(ms){return(ms/1000).toFixed(2)+'秒'}function finish(){if(!running)return;running=false;transitioning=true;cancelAnimationFrame(raf);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('finalDone').textContent=done;$('selectCount').textContent=selectCount;$('cancelled').textContent=cancelled;if(times.length){$('fastest').textContent=sec(Math.min(...times));$('average').textContent=sec(times.reduce((a,b)=>a+b,0)/times.length)}else{$('fastest').textContent=$('average').textContent='—'}}
$('startBtn').onclick=start;$('againBtn').onclick=start;$('backBtn').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')};
</script></body></html>
